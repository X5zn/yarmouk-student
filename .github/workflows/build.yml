name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Parser tests (SIS pages)
        run: |
          mkdir -p /tmp/pt && cp Tests/ParserTests.swift /tmp/pt/main.swift
          xcrun swiftc -swift-version 5 App/SISParsers.swift Shared/ClockFormat.swift /tmp/pt/main.swift -o /tmp/pt/run
          /tmp/pt/run

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (with AlarmKit)
        id: build_alarm
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project YarmoukStudent.xcodeproj -scheme YarmoukStudent -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) ALARMKIT' \
            build 2>&1 | tee build_alarm.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" | head -200

      - name: Build (without AlarmKit fallback)
        if: steps.build_alarm.outcome == 'failure'
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild -project YarmoukStudent.xcodeproj -scheme YarmoukStudent -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build_plain.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -200

      - name: Package unsigned IPA (entitlements embedded for Sideloadly)
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "YarmoukStudent.app" -type d | head -1)
          echo "App: $APP"
          for ext in "$APP"/PlugIns/*.appex; do
            codesign --force --sign - --entitlements Widgets/YarmoukWidgets.entitlements "$ext"
          done
          codesign --force --sign - --entitlements App/YarmoukStudent.entitlements "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry YarmoukStudent.ipa Payload)
          ls -la out
          echo "alarmkit=${{ steps.build_alarm.outcome }}" > out/build_info.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YarmoukStudent-ipa
          path: |
            out/YarmoukStudent.ipa
            out/build_info.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"

  screens:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for simulator
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild -project YarmoukStudent.xcodeproj -scheme YarmoukStudent -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee sim_build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -200

      - name: Create and boot simulator
        id: sim
        timeout-minutes: 15
        run: |
          DEVTYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; d=[x for x in json.load(sys.stdin)['devicetypes'] if x['name'].startswith('iPhone') and 'Pro Max' in x['name']]; print(d[-1]['identifier'])")
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('platform')=='iOS' and x.get('isAvailable')]; print(r[-1]['identifier'])")
          echo "device $DEVTYPE runtime $RUNTIME"
          UDID=$(xcrun simctl create shots "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Screenshots
        timeout-minutes: 15
        run: |
          APP=$(find simbuild/Build/Products -maxdepth 2 -name "YarmoukStudent.app" -type d | head -1)
          echo "App: $APP"
          bash .github/scripts/screens.sh "$APP" "${{ steps.sim.outputs.udid }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/*.png

      - name: Upload sim log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: "*.log"
